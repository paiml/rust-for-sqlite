[package]
name = "fscrawl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fscrawl"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
walkdir = "2"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
